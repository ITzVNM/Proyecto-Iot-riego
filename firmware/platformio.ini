; ============================================================
;  Proyecto agrivoltaico - 4 x Heltec WiFi LoRa 32 V3
;  Nodo 1: termico    (3 x MAX31865/PT100 + AHT20/BMP280)
;  Nodo 2: radiacion  (piranometro + LTR390 + INA3221)
;  Nodo 3: cultivo    (suelo + DHT22 + flujo + electrovalvula)
;  Gateway: LoRa -> Wi-Fi -> MQTT/WebSocket
;
;  Para subir cada firmware con UNA sola placa conectada:
;     pio run -e nodo1 -t upload
;  Si hay varias conectadas, agrega  upload_port = COMx  en el entorno.
; ============================================================

[env]
; Versión de la plataforma: ver docs/versiones.md (fijar con espressif32@<versión> para reproducir exactamente)
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200

; ---------------- Firmware definitivo ----------------
[env:gateway]
build_src_filter = -<*> +<gateway.cpp>
lib_deps = jgromes/RadioLib@7.8.1

[env:nodo1]
build_src_filter = -<*> +<nodo.cpp>
build_flags = -DNODE_ID=1
lib_deps =
    jgromes/RadioLib@7.8.1
    adafruit/Adafruit AHTX0@2.0.6
    adafruit/Adafruit BMP280 Library@3.0.0
    adafruit/Adafruit MAX31865 library@1.6.2

[env:nodo2]
build_src_filter = -<*> +<nodo.cpp>
build_flags = -DNODE_ID=2
lib_deps =
    jgromes/RadioLib@7.8.1
    adafruit/Adafruit LTR390 Library@1.1.2

[env:nodo3]
build_src_filter = -<*> +<nodo.cpp>
build_flags = -DNODE_ID=3
lib_deps =
    jgromes/RadioLib@7.8.1
    adafruit/DHT sensor library@1.4.7

; ---------------- Pruebas de hardware (una placa a la vez) ----------------
[env:t_i2c_scan]
build_src_filter = -<*> +<tests/test_i2c.cpp>

[env:t_i2c_nodo1]
build_src_filter = -<*> +<tests/test_i2c_lecturas.cpp>
build_flags = -DROL_NODO1
lib_deps =
    adafruit/Adafruit AHTX0@2.0.6
    adafruit/Adafruit BMP280 Library@3.0.0

[env:t_i2c_nodo2]
build_src_filter = -<*> +<tests/test_i2c_lecturas.cpp>
build_flags = -DROL_NODO2
lib_deps = adafruit/Adafruit LTR390 Library@1.1.2

[env:t_pt100]
build_src_filter = -<*> +<tests/test_max31865.cpp>
lib_deps = adafruit/Adafruit MAX31865 library@1.6.2

[env:t_rs485_nodo2]
build_src_filter = -<*> +<tests/test_rs485.cpp>
build_flags = -DROL_NODO2

[env:t_rs485_nodo3]
build_src_filter = -<*> +<tests/test_rs485.cpp>
build_flags = -DROL_NODO3

[env:t_dht]
build_src_filter = -<*> +<tests/test_dht.cpp>
lib_deps = adafruit/DHT sensor library@1.4.7

[env:t_flujo]
build_src_filter = -<*> +<tests/test_flujo.cpp>

[env:t_rele]
build_src_filter = -<*> +<tests/test_rele.cpp>
